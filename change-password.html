<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — NITBFreshers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Back button -->
    <a href="/dashboard.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
    </a>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="bg-slate-50 dark:bg-slate-900 px-6 py-5 border-b border-slate-200 dark:border-slate-700">
        <h2 class="font-bold text-lg text-slate-900 dark:text-white">Change Password</h2>
        <p class="text-xs text-slate-500 mt-0.5">Minimum 8 characters required</p>
      </div>

      <div class="p-6 space-y-4">

        <!-- Success -->
        <div id="successBox" class="hidden p-4 bg-green-50 dark:bg-green-900/30 border border-green-100 dark:border-green-800 rounded-xl">
          <div class="flex items-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4 text-green-600"></i>
            <p class="text-sm font-semibold text-green-700 dark:text-green-400">Password changed successfully!</p>
          </div>
        </div>

        <!-- Error -->
        <div id="errorBox" class="hidden p-4 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 rounded-xl">
          <div class="flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i>
            <p id="errorMsg" class="text-sm font-medium text-red-700 dark:text-red-400"></p>
          </div>
        </div>

        <!-- Fields -->
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Current Password</label>
          <input id="oldPassword" type="password" placeholder="••••••••"
            class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">New Password</label>
          <input id="newPassword" type="password" placeholder="Min. 8 characters"
            class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm New Password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat new password"
            class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
        </div>

        <button id="submitBtn" onclick="changePassword()"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold rounded-xl transition-colors">
          Update Password
        </button>

      </div>
    </div>
  </div>

  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    lucide.createIcons();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');

    // Auth guard
    requireAuth();

    async function changePassword() {
      const old     = document.getElementById('oldPassword').value;
      const newP    = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn     = document.getElementById('submitBtn');
      const errBox  = document.getElementById('errorBox');
      const errMsg  = document.getElementById('errorMsg');
      const sucBox  = document.getElementById('successBox');

      errBox.classList.add('hidden');
      sucBox.classList.add('hidden');

      if (!old || !newP || !confirm) {
        errMsg.textContent = 'All fields are required.';
        errBox.classList.remove('hidden');
        return;
      }
      if (newP.length < 8) {
        errMsg.textContent = 'New password must be at least 8 characters.';
        errBox.classList.remove('hidden');
        return;
      }
      if (newP !== confirm) {
        errMsg.textContent = 'New passwords do not match.';
        errBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        await Password.change(old, newP, confirm);
        sucBox.classList.remove('hidden');
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        lucide.createIcons();
      } catch (err) {
        errMsg.textContent = err.message || 'Failed to update password.';
        errBox.classList.remove('hidden');
        lucide.createIcons();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
