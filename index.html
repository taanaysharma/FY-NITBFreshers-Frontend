<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NITBFreshers Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    }
  </style>
</head>

<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Logo + Title -->
  <div class="mb-8 text-center">
    <div class="bg-white/10 backdrop-blur p-4 rounded-2xl inline-block mb-4 border border-white/20">
      <img src="./assets/images/logo.png" alt="MANIT Logo" class="h-16 w-auto object-contain">
    </div>
    <h1 class="text-3xl font-bold text-white">
      NITB<span class="text-red-400">Freshers</span>
    </h1>
    <p class="text-slate-400 text-sm mt-1 font-medium">Study Portal · NIT Bhopal</p>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">

    <!-- Card Header -->
    <div class="bg-slate-50 dark:bg-slate-900 px-8 py-5 border-b border-slate-200 dark:border-slate-700">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white">Student Login</h2>
      <p class="text-xs text-slate-500 mt-0.5">Use your Scholar Number to access the portal</p>
    </div>

    <div class="p-8">

      <!-- Info Banner -->
      <div class="mb-6 p-3 bg-blue-50 dark:bg-blue-900/30 border border-blue-100 dark:border-blue-800 rounded-xl flex items-center gap-3">
        <i data-lucide="info" class="w-4 h-4 text-blue-500 flex-shrink-0"></i>
        <p class="text-xs text-blue-700 dark:text-blue-300 font-medium">
          First time? Your default password is your Scholar Number.
        </p>
      </div>

      <!-- Error Box -->
      <div id="errorBox" class="hidden mb-5 p-4 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 rounded-xl">
        <div class="flex items-center gap-2 mb-1">
          <i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i>
          <span class="text-sm font-semibold text-red-700 dark:text-red-400">Login Failed</span>
        </div>
        <p id="errorMsg" class="text-xs text-red-600 dark:text-red-300 ml-6"></p>
        <a href="/forget-password.html" class="text-xs text-red-700 dark:text-red-400 underline ml-6 mt-1 block">
          Forgot your password?
        </a>
      </div>

      <!-- Form -->
      <div class="space-y-5">

        <!-- Scholar Number -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Scholar Number
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
            </div>
            <input
              id="username"
              type="text"
              placeholder="e.g. 251110100"
              maxlength="15"
              autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">
              Password
            </label>
            <a href="/forget-password.html" class="text-xs text-blue-600 hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
            </div>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full pl-10 pr-12 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            >
            <button
              type="button"
              onclick="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            >
              <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button
          id="loginBtn"
          onclick="doLogin()"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-200 dark:shadow-blue-900 flex items-center justify-center gap-2"
        >
          <span id="loginBtnText">Login</span>
          <i data-lucide="arrow-right" class="w-4 h-4" id="loginBtnIcon"></i>
        </button>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <p class="mt-6 text-xs text-center text-slate-500 max-w-sm leading-relaxed">
    This portal is maintained by senior students of NIT Bhopal for academic use only.
  </p>

  <!-- Scripts -->
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Dark mode
    if (localStorage.theme === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }

    // Already logged in check
    (async () => {
      const cached = getUser();
      if (cached) {
        try {
          await Auth.me();
          window.location.href = '/dashboard.html';
        } catch {
          localStorage.removeItem('user');
        }
      }
    })();

    // ─── Login Function ───────────────────────────────────────
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const btnText  = document.getElementById('loginBtnText');
      const btnIcon  = document.getElementById('loginBtnIcon');
      const errorBox = document.getElementById('errorBox');
      const errorMsg = document.getElementById('errorMsg');

      // Hide error
      errorBox.classList.add('hidden');

      // Validation
      if (!username) {
        errorMsg.textContent = 'Please enter your Scholar Number.';
        errorBox.classList.remove('hidden');
        document.getElementById('username').focus();
        return;
      }
      if (!password) {
        errorMsg.textContent = 'Please enter your password.';
        errorBox.classList.remove('hidden');
        document.getElementById('password').focus();
        return;
      }

      // Loading state
      btn.disabled = true;
      btnText.textContent = 'Logging in...';
      btnIcon.setAttribute('data-lucide', 'loader');
      lucide.createIcons();

      try {
        const data = await Auth.login(username, password);
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message || 'Login failed. Please try again.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Login';
        btnIcon.setAttribute('data-lucide', 'arrow-right');
        lucide.createIcons();
      }
    }

    // Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // Password toggle
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }
  </script>

</body>
</html>
