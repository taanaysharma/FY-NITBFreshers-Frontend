<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — NITBFreshers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-900">
        <i data-lucide="shield" class="w-7 h-7 text-white"></i>
      </div>
      <h1 class="text-xl font-bold text-white">Admin Panel</h1>
      <p class="text-slate-400 text-sm mt-1">NITBFreshers Portal</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
      <div class="px-6 py-5 border-b border-slate-700">
        <h2 class="font-bold text-white">Sign In</h2>
        <p class="text-xs text-slate-400 mt-0.5">Authorized personnel only</p>
      </div>

      <div class="p-6 space-y-4">

        <!-- Error -->
        <div id="errorBox" class="hidden p-3 bg-red-900/40 border border-red-800 rounded-xl flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 flex-shrink-0"></i>
          <p id="errorMsg" class="text-sm text-red-400"></p>
        </div>

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="user" class="w-4 h-4 text-slate-500"></i>
            </div>
            <input id="username" type="text" placeholder="admin"
              autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-4 h-4 text-slate-500"></i>
            </div>
            <input id="password" type="password" placeholder="••••••••"
              autocomplete="current-password"
              class="w-full pl-10 pr-12 py-2.5 bg-slate-900 border border-slate-600 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            <button type="button" onclick="togglePwd()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
              <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button id="loginBtn" onclick="doLogin()"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span id="btnText">Sign In</span>
        </button>

      </div>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">
      This panel is restricted to authorized admins only.
    </p>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    lucide.createIcons();

    // ── Admin API (separate from student Auth) ─────────────────
    const ADMIN_BASE = BASE_URL + '/admin';

    async function adminLogin(username, password) {
      const res = await fetch(ADMIN_BASE + '/login.php', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'text/plain' }, // OPTIONS preflight avoid karne ke liye (InfinityFree limitation)
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      return data;
    }

    // Already logged in?
    (async () => {
      try {
        const res = await fetch(BASE_URL + '/admin/me.php', { credentials: 'include' });
        if (res.ok) window.location.href = '/admin/dashboard.html';
      } catch {}
    })();

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const btnText  = document.getElementById('btnText');
      const errBox   = document.getElementById('errorBox');
      const errMsg   = document.getElementById('errorMsg');

      errBox.classList.add('hidden');

      if (!username || !password) {
        errMsg.textContent = 'Username and password required.';
        errBox.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Signing in...';

      try {
        await adminLogin(username, password);
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errMsg.textContent = err.message || 'Invalid credentials.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        lucide.createIcons();
      }
    }

    function togglePwd() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      input.type  = input.type === 'password' ? 'text' : 'password';
      icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
      lucide.createIcons();
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
