<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYQs — NITBFreshers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-900 dark:text-white">

  <!-- NAV -->
  <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <span class="font-bold">Previous Year Questions</span>
      </div>
      <button onclick="toggleDark()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">
        <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- Batch Selector -->
    <div class="mb-6">
      <p class="text-sm font-semibold text-slate-600 dark:text-slate-400 mb-3">Select Batch Year</p>
      <div class="flex gap-3 flex-wrap">
        <button onclick="selectBatch('2024')" id="batch-2024"
          class="batch-btn px-5 py-2.5 rounded-xl font-semibold text-sm border-2 transition-all border-slate-200 dark:border-slate-600 hover:border-blue-400">
          2024 Batch
        </button>
        <button onclick="selectBatch('2025')" id="batch-2025"
          class="batch-btn px-5 py-2.5 rounded-xl font-semibold text-sm border-2 transition-all border-slate-200 dark:border-slate-600 hover:border-blue-400">
          2025 Batch
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="hidden flex flex-col items-center justify-center py-20 gap-3">
      <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-slate-400 text-sm">Loading PYQs...</p>
    </div>

    <!-- Initial State -->
    <div id="initialState" class="flex flex-col items-center justify-center py-20 gap-3 text-slate-400">
      <i data-lucide="file-search" class="w-12 h-12"></i>
      <p>Select a batch to view PYQs</p>
    </div>

    <!-- Breadcrumb -->
    <div id="breadcrumb" class="hidden flex items-center gap-2 text-sm text-slate-500 mb-5 flex-wrap"></div>

    <!-- Grid -->
    <div id="grid" class="hidden"></div>

    <!-- PDF Viewer -->
    <div id="pdfViewer" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <button onclick="closePdf()" class="flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
        </button>
        <a id="downloadBtn" href="#" target="_blank"
          class="flex items-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-700">
          <i data-lucide="download" class="w-4 h-4"></i> Download
        </a>
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <iframe id="pdfFrame" src="" class="w-full h-screen rounded-2xl"></iframe>
      </div>
    </div>

  </main>

  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    lucide.createIcons();
    if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      lucide.createIcons();
    }

    requireAuth();

    let activeBatch  = null;
    let activeGroup  = null;
    let activeSubject = null;

    // ── Batch Select ──────────────────────────────────────────
    function selectBatch(year) {
      activeBatch   = year;
      activeGroup   = null;
      activeSubject = null;

      document.querySelectorAll('.batch-btn').forEach(b => {
        b.classList.remove('border-blue-600', 'bg-blue-50', 'dark:bg-blue-900/20', 'text-blue-700', 'dark:text-blue-300');
        b.classList.add('border-slate-200', 'dark:border-slate-600');
      });

      const btn = document.getElementById('batch-' + year);
      btn.classList.add('border-blue-600', 'bg-blue-50', 'dark:bg-blue-900/20', 'text-blue-700', 'dark:text-blue-300');
      btn.classList.remove('border-slate-200', 'dark:border-slate-600');

      loadGroups();
    }

    // ── Load using Resources API with batch prefix ────────────
    // PYQs are stored in study_material/PYQ2024/ and PYQ2025/
    async function loadGroups() {
      showLoading();
      try {
        const data = await Resources.subjects('PYQ' + activeBatch);
        renderCards(data.subjects, openSubject,
          'file-text', 'text-purple-600', 'bg-purple-50 dark:bg-purple-900/20');
        updateBreadcrumb();
      } catch {
        // Fallback — show message
        showGrid();
        document.getElementById('grid').innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-3"></i>
            <p>No PYQs available for ${activeBatch} batch yet</p>
          </div>`;
        lucide.createIcons();
      }
    }

    async function openSubject(subject) {
      activeSubject = subject;
      showLoading();
      try {
        const data = await Resources.files('PYQ' + activeBatch, subject, '');
        // Files might be directly in subject folder
        if (data.files && data.files.length > 0) {
          renderFiles(data.files);
        } else if (data.folders && data.folders.length > 0) {
          renderCards(data.folders, openFolder,
            'folder', 'text-yellow-600', 'bg-yellow-50 dark:bg-yellow-900/20');
        } else {
          showGrid();
          document.getElementById('grid').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">No files yet</div>`;
        }
        updateBreadcrumb();
      } catch (err) {
        showGrid();
        document.getElementById('grid').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">${err.message}</div>`;
      }
    }

    async function openFolder(folder) {
      showLoading();
      try {
        const data = await Resources.files('PYQ' + activeBatch, activeSubject, folder);
        renderFiles(data.files || []);
        updateBreadcrumb();
      } catch (err) {
        showGrid();
        document.getElementById('grid').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">${err.message}</div>`;
      }
    }

    // ── Renders ───────────────────────────────────────────────
    function renderCards(items, clickFn, icon, color, bg) {
      const grid = document.getElementById('grid');
      grid.className = 'grid gap-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3';
      grid.innerHTML = items.map(item => `
        <button onclick='(${clickFn.toString()})("${item.replace(/"/g, '\\"')}")'
          class="text-left p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-600 hover:shadow-md transition-all flex items-center gap-3 group">
          <div class="w-10 h-10 ${bg} rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
            <i data-lucide="${icon}" class="w-5 h-5 ${color}"></i>
          </div>
          <span class="font-semibold text-slate-800 dark:text-white text-sm">${item}</span>
        </button>
      `).join('');
      showGrid();
    }

    function renderFiles(files) {
      const grid = document.getElementById('grid');
      if (!files.length) {
        grid.className = 'grid';
        grid.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">No files in this folder yet</div>`;
        showGrid();
        return;
      }

      grid.className = 'grid gap-2';
      grid.innerHTML = files.map(file => `
        <button onclick='openPdf("${file.name}")'
          class="text-left p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-600 hover:shadow-md transition-all flex items-center gap-3 group">
          <div class="w-10 h-10 bg-red-50 dark:bg-red-900/20 rounded-xl flex items-center justify-center flex-shrink-0">
            <i data-lucide="file-text" class="w-5 h-5 text-red-500"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-medium text-slate-800 dark:text-white text-sm truncate">${file.name}</p>
            <p class="text-xs text-slate-400 mt-0.5">${file.ext.toUpperCase()} · ${file.size}</p>
          </div>
          <i data-lucide="external-link" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 transition-colors flex-shrink-0"></i>
        </button>
      `).join('');
      showGrid();
    }

    function openPdf(fileName) {
      const url = Resources.fileUrl('PYQ' + activeBatch, activeSubject, '', fileName);
      document.getElementById('grid').classList.add('hidden');
      document.getElementById('breadcrumb').classList.add('hidden');
      document.getElementById('pdfViewer').classList.remove('hidden');
      document.getElementById('pdfFrame').src = url;
      document.getElementById('downloadBtn').href = url;
      lucide.createIcons();
    }

    function closePdf() {
      document.getElementById('pdfViewer').classList.add('hidden');
      document.getElementById('pdfFrame').src = '';
      document.getElementById('grid').classList.remove('hidden');
      document.getElementById('breadcrumb').classList.remove('hidden');
    }

    // ── Breadcrumb ────────────────────────────────────────────
    function updateBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      bc.classList.remove('hidden');
      let html = `<span class="font-medium text-slate-700 dark:text-slate-300">Batch ${activeBatch}</span>`;
      if (activeSubject) {
        html += `<i data-lucide="chevron-right" class="w-3 h-3"></i>
          <span class="text-slate-700 dark:text-slate-300">${activeSubject}</span>`;
      }
      bc.innerHTML = html;
      lucide.createIcons();
    }

    // ── UI Helpers ────────────────────────────────────────────
    function showLoading() {
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('initialState').classList.add('hidden');
      document.getElementById('grid').classList.add('hidden');
      document.getElementById('pdfViewer').classList.add('hidden');
    }
    function showGrid() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('initialState').classList.add('hidden');
      document.getElementById('grid').classList.remove('hidden');
      lucide.createIcons();
    }
  </script>
</body>
</html>
